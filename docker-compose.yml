version: '2.4'

services:
  web:
    build: .
    container_name: marianska-chata
    expose:
      - '3000'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Heap must stay well below mem_limit (512m) - single source of the runtime heap limit
      - NODE_OPTIONS=--max-old-space-size=256
    command: npm start
    restart: unless-stopped
    networks:
      - marianska-net
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 256m

  nginx:
    image: nginx:alpine
    container_name: marianska-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - marianska-net
    mem_limit: 128m
    memswap_limit: 256m

networks:
  marianska-net:
    driver: bridge
